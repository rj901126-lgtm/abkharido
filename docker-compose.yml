services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - abkharido-net

  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    # Exposed only to the docker network, not to the host machine directly
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - abkharido-net

  backend:
    build:
      context: .
      dockerfile: backend.Dockerfile
    # Exposed only to the docker network, not to the host machine directly
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - REDIS_URI=redis://redis:6379
      - DB_URI=mongodb://mongodb:27017/abkharido
      # NOTE: Update .env with real secrets for Production/AWS
    env_file:
      - .env
    depends_on:
      - redis
      - mongodb
    networks:
      - abkharido-net

  redis:
    image: redis:7-alpine
    # Removed ports binding for security (only accessible inside abkharido-net)
    volumes:
      - redis_data:/data
    networks:
      - abkharido-net

  mongodb:
    image: mongo:7
    # Removed ports binding for security (only accessible inside abkharido-net)
    volumes:
      - mongo_data:/data/db
    networks:
      - abkharido-net

volumes:
  redis_data:
  mongo_data:

networks:
  abkharido-net:
    driver: bridge
