services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
    networks:
      - abkharido-net

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: frontend.Dockerfile
      args:
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    # Exposed only to the docker network, not to the host machine directly
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/abkharido?replicaSet=abkharido-rs}
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - abkharido-net

  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: backend.Dockerfile
    # Exposed only to the docker network, not to the host machine directly
    expose:
      - "5000"
    environment:
      - NODE_ENV=production
      - REDIS_URI=redis://redis:6379
      - MONGODB_URI=${MONGODB_URI:-mongodb://mongodb:27017/abkharido?replicaSet=abkharido-rs}
      # NOTE: Update .env with real secrets for Production/AWS
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_healthy
    networks:
      - abkharido-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Removed ports binding for security (only accessible inside abkharido-net)
    volumes:
      - redis_data:/data
    networks:
      - abkharido-net

  mongodb:
    image: mongo:7
    command: ["mongod", "--replSet", "abkharido-rs", "--bind_ip_all"]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate({_id: \"abkharido-rs\", members: [{_id: 0, host: \"mongodb:27017\"}]}) }; if (!db.hello().isWritablePrimary) quit(1)' "]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    # Removed ports binding for security (only accessible inside abkharido-net)
    volumes:
      - mongo_data:/data/db
    networks:
      - abkharido-net

volumes:
  redis_data:
  mongo_data:

networks:
  abkharido-net:
    driver: bridge
